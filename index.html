<!doctype html>
<html lang="it" data-theme-keep="paper cream ink line soft">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Sito</title><meta name="description" content=""><link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script src="data.js"></script>
<style>
/* LAYOUT "storico": giornale d'epoca, seppia, colonne e capolettera. Locali storici "dal 19xx", pizzerie vintage, bar d'altri tempi, botteghe storiche. */
:root{--primary:#6b1d1d;--primary-2:#2a1f17;--accent:#6b1d1d;--accent-2:#e6cf9c;--soft:#ebdfc4;--cream:#efe3c8;--paper:#f4ecd8;--ink:#2a1f17;--muted:#5e503f;--line:#2a1f17;--max:1120px}
body{font-family:"Libre Baskerville",Georgia,serif;color:var(--ink);background:var(--paper);font-size:15.5px}
h1,h2,h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;line-height:1.02}
.kicker{font-family:Oswald,sans-serif;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase}
.eyebrow{font-family:Oswald,sans-serif;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.btn{padding:.8em 1.4em;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.82rem;font-weight:500;border-radius:0}
.btn-primary{background:var(--ink);color:var(--paper)}.btn-secondary{border:2px solid var(--ink);color:var(--ink)}
.rules{border-top:3px double var(--line);border-bottom:1px solid var(--line)}
.mast{text-align:center;padding-block:1.4rem .8rem}
.mast .meta{display:flex;justify-content:space-between;gap:1rem;font-family:Oswald,sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.8rem}
.mast h1.name{font-size:clamp(2.6rem,9vw,6rem);letter-spacing:.01em}
.mast .tag{font-style:italic;color:var(--muted);margin-top:.3rem}
header{position:sticky;top:0;z-index:50;background:var(--paper)}
header .wrap{display:flex;justify-content:center;align-items:center;gap:1.8rem;height:52px}
header nav{display:flex;gap:1.8rem;align-items:center;font-family:Oswald,sans-serif;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
header nav a{text-decoration:none}header nav .btn{padding:.45em .9em;font-size:.72rem}
.minilogo{width:34px;height:34px;object-fit:contain;display:none}
header.solid .minilogo{display:block}
@media (max-width:700px){header nav a:not(.btn){display:none}header .wrap{justify-content:space-between}.minilogo{display:block}}
.front{display:grid;grid-template-columns:1.35fr 1fr;gap:34px;padding-block:clamp(28px,5vw,50px);border-bottom:1px solid var(--line)}
.front figure img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:sepia(.35) contrast(1.05) saturate(.85);border:1px solid var(--line)}
.front figcaption{font-style:italic;font-size:.82rem;color:var(--muted);margin-top:.5rem;border-top:1px solid var(--line);padding-top:.4rem}
.front h2{font-size:clamp(2.2rem,5vw,3.8rem);margin:.3em 0 .4em}
.front h2 em{font-family:"Libre Baskerville",serif;font-style:italic;font-size:.62em;display:block;color:var(--accent);margin-top:.2em}
.front p.lead{font-size:1.05rem;line-height:1.75}
.front p.lead::first-letter{font-family:"Abril Fatface",serif;float:left;font-size:3.6em;line-height:.85;margin:.05em .1em 0 0;color:var(--accent)}
.cta{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.6rem}
.stamp-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.stamp-row span{border:2px solid var(--accent);color:var(--accent);font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;padding:.35em .7em;transform:rotate(-1.5deg)}
.stamp-row span:nth-child(even){transform:rotate(1.2deg)}.stamp-row i{display:none}
@media (max-width:820px){.front{grid-template-columns:1fr}}
section{padding:clamp(44px,7vw,80px) 0;border-bottom:1px solid var(--line)}
.sec-t{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem}
.sec-t::before,.sec-t::after{content:"";flex:1;border-top:3px double var(--line)}
.sec-t h2{font-size:clamp(1.8rem,4vw,2.8rem);text-align:center}
.pillars{display:grid;grid-template-columns:repeat(var(--n,4),1fr)}
.p-item{padding:0 1.2rem;text-align:center}.p-item+.p-item{border-left:1px solid var(--line)}
.p-n{font-family:"Abril Fatface",serif;font-size:2rem;color:var(--accent)}.p-item h3{font-size:1.2rem;margin:.3rem 0 .5rem}.p-item p{font-size:.88rem;color:var(--muted)}
@media (max-width:820px){.pillars{grid-template-columns:1fr 1fr;row-gap:1.6rem}.p-item:nth-child(3){border-left:0}}
.cols{column-count:2;column-gap:40px;column-rule:1px solid var(--line)}
.cols p{margin-bottom:1em;line-height:1.8;text-align:justify;hyphens:auto}
.cols p:first-child::first-letter{font-family:"Abril Fatface",serif;float:left;font-size:3.8em;line-height:.85;margin:.05em .1em 0 0;color:var(--accent)}
.cols ul{break-inside:avoid;border:1px solid var(--line);padding:1rem;margin-top:1rem}.cols li{font-style:italic;padding:.2rem 0}.cols li::before{content:"§ ";color:var(--accent)}
.cols img{width:100%;filter:sepia(.3) contrast(1.05);margin-bottom:1rem;break-inside:avoid;border:1px solid var(--line)}
@media (max-width:760px){.cols{column-count:1}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.g-item{background:#fbf6ea;border:1px solid var(--line);padding:10px;box-shadow:3px 3px 0 var(--line)}
.g-item img{width:100%;aspect-ratio:1;object-fit:cover;filter:sepia(.3) contrast(1.05)}
.g-item figcaption{font-style:italic;font-size:.8rem;text-align:center;margin-top:.5rem;color:var(--muted)}
@media (max-width:700px){.gallery{grid-template-columns:1fr 1fr}}
.menu-bar{position:sticky;top:52px;z-index:10;background:var(--paper);padding:.6rem 0;border-bottom:1px solid var(--line);margin-bottom:1.6rem}
.menu-tabs{justify-content:center}
.menu-tabs button{background:none;border:0;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--muted);padding:.3em .6em}
.menu-tabs button[aria-selected=true]{color:var(--paper);background:var(--ink)}
.menu-pick{border:2px solid var(--ink);background:var(--paper);padding:.55em .9em;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;border-radius:0}
.menu-search{border-radius:0}.menu-search input{border:2px solid var(--ink)}
@media (min-width:761px){.menu-ctl{flex-direction:column}}
.m-list{column-count:2;column-gap:44px;column-rule:1px solid var(--line)}
@media (max-width:860px){.m-list{column-count:1}}
.m-cat{display:block;margin-bottom:2.2rem}
.m-cat-h{text-align:center;border-top:3px double var(--line);border-bottom:1px solid var(--line);padding:.4rem 0;margin-bottom:.8rem;break-after:avoid}
.m-cat-h h3{font-size:1.6rem}.m-cat-h small{display:block;font-style:italic;font-size:.8rem;color:var(--muted)}
.m-item{padding:.45rem 0;break-inside:avoid}
.m-name{font-weight:700;font-variant:small-caps;letter-spacing:.04em;font-size:1.05rem}
.m-dots{border-bottom:1px dotted var(--line);transform:translateY(-5px)}
.m-price{font-family:Oswald,sans-serif;font-weight:500}.m-desc{font-style:italic}
.m-tag{border:1px solid var(--accent);color:var(--accent);background:none;font-family:Oswald,sans-serif}
.notes{display:grid;gap:.3rem;text-align:center;font-style:italic;font-size:.82rem;color:var(--muted);margin-top:1rem}.notes a{color:var(--accent);font-weight:700}
.info{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:0;border:1px solid var(--line)}
.info>div{padding:1.4rem}.info>div+div{border-left:1px solid var(--line)}
.info h3{font-size:1.5rem;margin:.5rem 0 .8rem}.info p{line-height:1.8}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}.actions .btn{padding:.6em 1em;font-size:.72rem}
.map{padding:0!important;min-height:320px;filter:sepia(.5) contrast(.95)}
@media (max-width:900px){.info{grid-template-columns:1fr}.info>div+div{border-left:0;border-top:1px solid var(--line)}}
footer{padding:40px 0;text-align:center;font-size:.85rem;border-top:3px double var(--line)}
footer .name{font-family:"Abril Fatface",serif;font-size:2rem}
.social{justify-content:center;margin:1rem 0}.social a{border:1.5px solid var(--ink)}
.legal{font-style:italic;color:var(--muted);margin-top:.8rem}
.callbar .btn-secondary{background:var(--paper)}
</style>
</head>
<body>
<div class="wrap mast" id="top">
  <div class="meta"><span data-s="city"></span><span data-if="since"><span data-s="since"></span></span><span data-s="tagline"></span></div>
  <h1 class="name" data-s="name"></h1>
  <p class="tag" data-s="hero-eyebrow"></p>
</div>
<header data-solid data-sticky class="rules"><div class="wrap"><img class="minilogo" data-s="logo" alt=""><nav data-s="nav"></nav></div></header>
<div class="wrap front">
  <figure class="reveal"><img data-s="hero-img" fetchpriority="high"><figcaption data-s="addressShort"></figcaption></figure>
  <div class="reveal"><span class="kicker">In primo piano</span><h2 data-s="hero-title"></h2><p class="lead" data-s="hero-lead"></p><div class="cta" data-s="hero-cta"></div><div class="stamp-row" data-s="hero-badges"></div></div>
</div>
<section data-section="pillars"><div class="wrap"><div class="pillars reveal" data-s="pillars"></div></div></section>
<section id="storia" data-section="story"><div class="wrap">
  <div class="sec-t"><h2 data-s="story-title"></h2></div>
  <div class="cols reveal"><img data-s="story-img" loading="lazy"><div data-s="story-body"></div><ul data-s="story-bullets"></ul></div>
</div></section>
<section id="galleria" data-section="gallery"><div class="wrap">
  <div class="sec-t"><h2 data-s="gallery-title"></h2></div>
  <div class="gallery reveal" data-s="gallery" data-max="6" data-captions="yes"></div>
</div></section>
<section id="menu" data-section="menu">
  <div class="wrap"><div class="sec-t"><h2 data-s="menu-title"></h2></div><p data-s="menu-lead" style="text-align:center;font-style:italic;color:var(--muted);margin:-.6rem 0 1.2rem"></p></div>
  <div class="menu-bar" data-sticky><div class="wrap menu-ctl"><div class="menu-tabs" role="tablist" data-s="menu-tabs"></div><select class="menu-pick" data-s="menu-pick" aria-label="Categoria"></select><label class="menu-search" data-s="menu-search"></label></div></div>
  <div class="wrap"><div class="m-list" data-s="menu-list" data-style="list"></div><p data-s="menu-empty" style="text-align:center">Nessun piatto trovato.</p><div class="notes" data-s="menu-notes"></div></div>
</section>
<section id="dove"><div class="wrap">
  <div class="sec-t"><h2>Dove siamo</h2></div>
  <div class="info reveal">
    <div data-section="hours"><span class="status" data-s="status"></span><h3>Orari</h3><table class="hours" data-s="hours"></table><p data-s="hours-note"></p></div>
    <div><h3>Contatti</h3><p data-s="contacts"></p><div class="actions" data-s="contact-actions"></div></div>
    <div class="map"><iframe data-s="map"></iframe></div>
  </div>
</div></section>
<footer><div class="wrap"><div class="name" data-s="name"></div><div class="social" data-s="social"></div><p data-s="footer-contacts"></p><p class="legal" data-s="legal"></p></div></footer>
<div class="callbar" data-s="callbar"></div>
<script src="core.js"></script>
</body>
</html>
